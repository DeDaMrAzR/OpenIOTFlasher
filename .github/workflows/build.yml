name: Build and Release OpenIOTFlasher

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set OpenIOTFlasher version
        shell: pwsh
        run: |
          $version = "1.0.0"
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tags must use semantic version format vMAJOR.MINOR.PATCH."
            }
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          "FLASHERVERSION=$version" >> $env:GITHUB_ENV

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Create output directory
        run: mkdir -p BuildOutput/Release

      - name: Build OpenIOTFlasher
        shell: pwsh
        run: msbuild BK7231Flasher/BK7231Flasher.csproj /p:Configuration=Release /p:OutDir=BuildOutput\Release\ /p:FLASHERVERSION=$env:FLASHERVERSION

      - name: Set OpenIOTFlasher executable name
        shell: pwsh
        run: |
          $outputDirectory = "BK7231Flasher/BuildOutput/Release"
          $sourceExecutable = Join-Path $outputDirectory "OpenIOT_flasher.exe"
          $releaseExecutable = Join-Path $outputDirectory "OpenIOTFlasher.exe"
          $sourceConfiguration = Join-Path $outputDirectory "OpenIOT_flasher.exe.config"
          $releaseConfiguration = Join-Path $outputDirectory "OpenIOTFlasher.exe.config"
          if (-not (Test-Path -LiteralPath $sourceExecutable)) {
            throw "Expected build output was not found: $sourceExecutable"
          }
          if (-not (Test-Path -LiteralPath $sourceConfiguration)) {
            throw "Expected executable configuration was not found: $sourceConfiguration"
          }
          Move-Item -LiteralPath $sourceExecutable -Destination $releaseExecutable
          Move-Item -LiteralPath $sourceConfiguration -Destination $releaseConfiguration

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: OpenIOTFlasher
          path: |
            BK7231Flasher/BuildOutput/Release/*.exe
            BK7231Flasher/BuildOutput/Release/*.exe.config
            BK7231Flasher/BuildOutput/Release/*.dll
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: OpenIOTFlasher
          path: BuildOutput/Release

      - name: Package OpenIOTFlasher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "BuildOutput/Release/*" -DestinationPath "release/OpenIOTFlasher-${{ github.ref_name }}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: OpenIOTFlasher ${{ github.ref_name }}
          body: |
            OpenIOTFlasher ${{ github.ref_name }}.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release/OpenIOTFlasher-${{ github.ref_name }}.zip
